services:
  alexa-bridge:
    build: .
    container_name: alexa-notify-bridge
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
