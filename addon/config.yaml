name: "Alexa Notify Bridge"
version: "1.1.0"
slug: "alexa_notify_bridge"
description: "Send custom proactive notifications to your Alexa devices via local HTTP requests"
url: "https://github.com/R91g/Alexa-Notify-Bridge"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": "Bridge API port"

# ─── User-configurable options (defaults) ────────────────────────────────────
options:
  alexa_client_id: ""
  alexa_client_secret: ""
  api_key: ""
  region: "EU"
  log_level: "INFO"
  default_expiry_hours: 24

# ─── Validation schema ──────────────────────────────────────────────────────
schema:
  alexa_client_id: "str"
  alexa_client_secret: "password"
  api_key: "password?"
  region: "match(^(NA|EU|FE)$)"
  log_level: "match(^(DEBUG|INFO|WARNING|ERROR)$)"
  default_expiry_hours: "float(0.1,24)"
